name: Release

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Install Node dependencies
        run: pnpm install

      - name: Run Quality Gate Checks
        run: |
          pnpm run check
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Browser Extension
        run: pnpm run extension:build

      - name: Build Tauri Desktop Package
        run: pnpm tauri build

      - name: Package Release Assets and Compute SHA-256
        run: node scripts/package-release.mjs

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "猫步下载器 v${{ env.APP_VERSION }} · Maobu Fetch v${{ env.APP_VERSION }}"
          body_path: releases_out/release_notes.md
          draft: false
          prerelease: false
          files: |
            releases_out/Maobu.Fetch_${{ env.APP_VERSION }}_x64-setup.exe
            releases_out/Maobu.Fetch_${{ env.APP_VERSION }}_x64.msi
            releases_out/maobu-fetch-v${{ env.APP_VERSION }}-portable.exe
            releases_out/maobu-fetch-extension-v${{ env.APP_VERSION }}.zip
            releases_out/extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
