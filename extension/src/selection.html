<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="selection.css">
  <title>猫步资源与批量链接提取器</title>
</head>
<body>
  <main>
    <header>
      <img src="icon128.png" alt="">
      <div>
        <b>猫步资源与批量链接提取器</b>
        <span id="linkCount">0 条资源</span>
      </div>
    </header>

    <div class="filter-bar">
      <input id="searchFilter" type="search" placeholder="搜索文件名、URL 或正则表达式 (如 \.mp4$)..." aria-label="搜索过滤">
    </div>

    <div id="categoryChips" class="category-chips"></div>

    <div class="select-row">
      <div class="select-left">
        <label><input type="checkbox" id="selectAll" checked> 全选</label>
        <button type="button" id="invertSelection" class="btn-text">反选</button>
      </div>
      <span id="filteredHint" class="hint">确认后添加任务到猫步下载器</span>
    </div>

    <div id="selectionList" class="link-list"></div>
    <p id="status" role="status"></p>

    <footer>
      <button id="cancel" class="secondary">取消</button>
      <button id="send" class="primary" disabled>下载所选（0）</button>
    </footer>
  </main>
  <script type="module" src="selection.js"></script>
</body>
</html>
