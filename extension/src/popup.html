<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>猫步下载器</title></head><body><main>
  <header><img src="icon128.png" alt=""><div><b>猫步下载器</b><span>Maobu Fetch · <em id="connection" style="font-style:normal">正在检测桌面端…</em></span></div><button id="topBypass" class="top-bypass-btn" title="点击临时暂停接管 10 分钟">⏸ 暂停接管 10m</button><i id="status"></i></header>
  <section id="pairBox" class="pair hidden"><b>连接桌面端</b><p>在猫步下载器的设置 → 浏览器中查看一次性配对码。</p><div><input id="pairCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位配对码" aria-label="6 位配对码"><button id="pair">配对</button></div></section>
  <section id="updateBox" class="pair hidden"><b>扩展需要更新</b><p id="updateText"></p><div><button id="reloadExt">重载扩展</button></div></section>
  <section class="quick"><label>快速下载</label><div class="quick-row"><div class="url-wrap" id="urlWrap"><span id="magnetBadge" class="magnet-badge hidden" title="检测到磁力链接，将作为 BT 任务下载">🧲</span><input id="url" placeholder="粘贴下载链接或 magnet: 磁力链接" aria-label="下载链接"><button id="paste" class="paste-btn" title="从剪贴板粘贴链接">⎘</button></div><button id="send">发送</button></div><p id="message">连接状态检测中…</p></section>
  <section id="authDownload" class="auth-download hidden">
    <div class="auth-dropdown" id="authDropdown">
      <button id="useAuthDownload" class="auth-toggle" title="点击展开登录态下载选项" aria-expanded="false" aria-haspopup="true">登录态下载 <i class="caret">▾</i></button>
      <div id="authMenu" class="auth-menu hidden" role="menu">
        <button id="authOneShot" class="auth-item" role="menuitem" title="将当前页 Cookie 一次性传递给桌面端"><span>一次性登录态下载</span><small>仅传当前页 Cookie，不持久化</small></button>
        <button id="authExportCookies" class="auth-item" role="menuitem" title="导出当前页 Cookie 为 cookies.txt 文件"><span>导出 cookies.txt</span><small>用于导入「媒体凭证」持久化保存</small></button>
      </div>
    </div>
  </section>
  <section id="siteBox" class="site hidden">
    <div class="section-title"><b id="siteHostLabel">当前站点</b><span id="siteChoiceBadge" class="hidden"></span></div>
    <div class="site-actions">
      <button id="siteAlwaysTake" title="此站点的下载总是交给猫步下载器（跳过大小/类型规则）">总是接管</button>
      <button id="siteAlwaysBypass" title="此站点的下载总是由浏览器处理">总是放行</button>
      <button id="siteClearChoice" class="hidden" title="清除记住的站点选择">清除记忆</button>
      <button id="restoreFab" class="hidden" title="重新在此站点显示页内悬浮下载按钮">恢复悬浮按钮</button>
      <button id="sniffToggle" title="为此站点开启流嗅探：记录页面播放器发出的媒体直链（仅内存，不上传）">流嗅探：关</button>
    </div>
  </section>
  <section id="sniffBox" class="sniff-box hidden">
    <div class="section-title"><b>页面嗅探到的媒体</b><span id="sniffCount">0</span></div>
    <div id="sniffList" class="media"></div>
  </section>
  <section id="diagBox" class="diag-box hidden">
    <div class="diag-header"><span>最近由浏览器下载（未接管）</span><button id="clearDiag" title="清空放行历史">清除</button></div>
    <div id="diagSummary" class="diag-summary"></div>
    <div id="ignoredList" class="ignored-list"></div>
  </section>
  <section id="tasksSection">
    <div class="section-title"><b>最近桌面端任务</b><span id="taskCount">0</span></div>
    <div id="taskSummaryRow" class="task-summary-row hidden"><span id="taskSummary"></span><button id="retryFailed" class="hidden" title="重新开始所有失败的任务">重试失败</button></div>
    <div id="tasks" class="tasks"><div class="empty">未连接桌面端或暂无任务</div></div>
  </section>
  <section><div class="section-title"><b>当前页面媒体</b><span id="count">0</span></div><div id="media" class="media"><div class="empty">当前页面暂未发现媒体资源</div></div></section>
  <section class="rules">
    <label><span><b>接管浏览器下载</b><small>离线时自动回退到浏览器</small></span><input id="intercept" type="checkbox"></label>
    <details class="rules-fold">
      <summary>更多接管设置</summary>
      <label><span><b>接管模式</b><small>自动：短暂倒计时后接管；询问：每次等你选择</small></span><select id="takeoverMode" aria-label="接管模式"><option value="auto">自动接管</option><option value="ask">每次询问</option></select></label>
      <label><span><b>自动接管等待</b><small>浮层倒计时，0 秒 = 不打扰直接接管</small></span><select id="autoDelay" aria-label="自动接管等待时间"><option value="0">0 秒（立即）</option><option value="1000">1 秒</option><option value="1500">1.5 秒</option><option value="2000">2 秒</option><option value="3000">3 秒</option><option value="5000">5 秒</option></select></label>
      <label><span><b>接管磁力链接</b><small>点击 magnet: 链接时转交猫步下载器</small></span><input id="interceptMagnet" type="checkbox"></label>
      <label><span><b>最小文件大小</b></span><span class="min-size"><select id="minSize" aria-label="最小文件大小"><option value="0">不限</option><option value="1">1 MB</option><option value="5">5 MB</option><option value="20">20 MB</option><option value="100">100 MB</option><option value="custom">自定义…</option></select><input id="minSizeCustom" type="number" min="1" step="1" placeholder="MB" aria-label="自定义最小文件大小（MB）" class="hidden"></span></label>
      <label><span><b>媒体画质偏好</b><small>页面媒体/视频探测使用的清晰度</small></span><select id="mediaQuality" aria-label="媒体画质偏好"><option value="best">最高画质</option><option value="1080">≤1080p</option><option value="720">≤720p</option><option value="audio">仅音频</option></select></label>
      <label><span><b>字幕语言</b><small>页面媒体探测附带的字幕</small></span><select id="subtitlePref" aria-label="字幕语言偏好"><option value="all">全部语言</option><option value="zh">优先中文</option><option value="none">不带字幕</option></select></label>
      <button id="bypass">暂停接管 10 分钟</button>
    </details>
  </section>
  <section class="rules-links"><button id="editRules">编辑接管规则</button></section>
  <footer><span>本地加密通信 · API v1</span><button id="refresh">重新检测</button></footer>
</main><script type="module" src="popup.js"></script></body></html>
